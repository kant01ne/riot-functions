AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Receives Riot Sonar revocation webhooks and removes the Google Drive or Microsoft 365 permission with your own credentials.

Metadata:
  AWS::ServerlessRepo::Application:
    Name: riot-sonar-drive-items-revocation
    Description: Receives Riot Sonar revocation webhooks and removes the Google Drive or Microsoft 365 permission with your own credentials.
    Author: Riot
    SpdxLicenseId: MIT
    LicenseUrl: ../../LICENSE
    ReadmeUrl: ../docs/deploy-aws.md
    Labels: [riot, sonar, google-drive, microsoft-365, webhook]
    HomePageUrl: https://github.com/kant01ne/riot-functions/tree/main/sonar-drive-items-revocation
    SourceCodeUrl: https://github.com/kant01ne/riot-functions/tree/main/sonar-drive-items-revocation
    SemanticVersion: 1.0.0

Resources:
  # Riot only shows its signing secret once the endpoint exists, and the endpoint needs this stack's URL, so the
  # stack starts with an empty secret that the deploy script, or the console, fills afterwards. Stack updates
  # leave the stored value alone because the template's value never changes.
  RevokerSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}
      Description: Riot signing secret and Google or Microsoft credentials of the Riot Sonar revoker, as JSON.
      SecretString: "{}"

  RevokerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../dist/aws/
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      # Google and Microsoft token exchanges plus the delete call; the 3 s default is too tight on a cold start.
      Timeout: 30
      Environment:
        Variables:
          SECRET_ARN: !Ref RevokerSecret
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref RevokerSecret
      Events:
        Webhook:
          Type: HttpApi
          Properties: { Path: /api/webhook, Method: POST }
        Check:
          Type: HttpApi
          Properties: { Path: /api/check, Method: POST }
        Status:
          Type: HttpApi
          Properties: { Path: /, Method: GET }

  RevokerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${RevokerFunction}
      RetentionInDays: 30

Outputs:
  WebhookUrl:
    Description: Paste this URL in Riot when creating the webhook endpoint.
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api/webhook
  StatusUrl:
    Description: Open this URL to check which credentials are configured.
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/
  SecretArn:
    Description: Store the Riot signing secret and the Google or Microsoft credentials here.
    Value: !Ref RevokerSecret
  FunctionName:
    Description: The Lambda function, for its logs.
    Value: !Ref RevokerFunction
